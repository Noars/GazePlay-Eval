name: Angular Karma Tests

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: sudo apt-get update && sudo apt-get install -y chromium

      - name: Run tests with ChromeHeadless
        run: npx ng test --watch=false --no-progress --browsers=ChromeHeadless
