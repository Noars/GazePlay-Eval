@if (selectedMode == null) {
  <div class="gp-page gp-page--narrow">
    <header class="gp-page-header">
      <div class="gp-page-header__text">
        <span class="gp-page-header__eyebrow">{{ 'steps.eyebrow' | t: {current: 3} }}</span>
        <h1 class="gp-page-header__title">{{ 'setup.title' | t }}</h1>
        <p class="gp-page-header__lead">{{ 'setup.lead' | t }}</p>
      </div>
    </header>

    <div class="mode-grid">
      <button type="button" class="gp-action-card mode-card" (click)="selectMode('manuel')">
        <span class="gp-action-card__icon" aria-hidden="true"><i class="bi bi-sliders2"></i></span>
        <span>
          <span class="gp-action-card__title">{{ 'setup.manual' | t }} <span class="gp-badge gp-badge--primary ms-1">{{ 'setup.recommended' | t }}</span></span>
          <span class="gp-action-card__desc">{{ 'setup.manual.desc' | t }}</span>
        </span>
      </button>

      <button type="button" class="gp-action-card mode-card" (click)="selectMode('auto')">
        <span class="gp-action-card__icon" aria-hidden="true"><i class="bi bi-magic"></i></span>
        <span>
          <span class="gp-action-card__title">{{ 'setup.auto' | t }} <span class="gp-badge gp-badge--warning ms-1">{{ 'setup.inDevelopment' | t }}</span></span>
          <span class="gp-action-card__desc">{{ 'setup.auto.desc' | t }}</span>
        </span>
      </button>
    </div>

    <nav class="gp-actions" [attr.aria-label]="'steps.nav' | t">
      <button type="button" class="gp-btn" (click)="backToInfoParticipant()">
        <i class="bi bi-arrow-left" aria-hidden="true"></i>
        {{ 'steps.previous' | t }}
      </button>
    </nav>
  </div>
} @else if (selectedMode == 'manuel') {
  <app-eval-manual (selectedModeChange)="onSelectedModeChange($event)"></app-eval-manual>
} @else if (selectedMode == 'auto') {
  <app-eval-automatic [selectedMode]="selectedMode" (selectedModeChange)="onSelectedModeChange($event)"></app-eval-automatic>
}
