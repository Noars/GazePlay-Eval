@if (selectedMode == null) {
  <div class="gp-page gp-page--narrow">
    <header class="gp-page-header">
      <div class="gp-page-header__text">
        <span class="gp-page-header__eyebrow">Étape 3 sur 5</span>
        <h1 class="gp-page-header__title">Mode de création</h1>
        <p class="gp-page-header__lead">Choisissez comment construire les écrans de votre évaluation.</p>
      </div>
    </header>

    <div class="mode-grid">
      <button type="button" class="gp-action-card mode-card" (click)="selectMode('manuel')">
        <span class="gp-action-card__icon" aria-hidden="true"><i class="bi bi-sliders2"></i></span>
        <span>
          <span class="gp-action-card__title">Manuel <span class="gp-badge gp-badge--primary ms-1">Recommandé</span></span>
          <span class="gp-action-card__desc">
            Définissez des paramètres par défaut, puis créez et ajustez chaque écran vous-même.
          </span>
        </span>
      </button>

      <button type="button" class="gp-action-card mode-card" (click)="selectMode('auto')">
        <span class="gp-action-card__icon" aria-hidden="true"><i class="bi bi-magic"></i></span>
        <span>
          <span class="gp-action-card__title">Automatique <span class="gp-badge gp-badge--warning ms-1">En développement</span></span>
          <span class="gp-action-card__desc">
            Génération automatique des écrans. Cette fonctionnalité n'est pas encore disponible.
          </span>
        </span>
      </button>
    </div>

    <nav class="gp-actions" aria-label="Navigation entre les étapes">
      <button type="button" class="gp-btn gp-btn--ghost" (click)="backToInfoParticipant()">
        <i class="bi bi-arrow-left" aria-hidden="true"></i>
        Précédent
      </button>
    </nav>
  </div>
} @else if (selectedMode == 'manuel') {
  <app-eval-manual (selectedModeChange)="onSelectedModeChange($event)"></app-eval-manual>
} @else if (selectedMode == 'auto') {
  <app-eval-automatic [selectedMode]="selectedMode" (selectedModeChange)="onSelectedModeChange($event)"></app-eval-automatic>
}
