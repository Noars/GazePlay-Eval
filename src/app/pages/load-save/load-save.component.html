<div class="gp-page">
  <header class="gp-page-header">
    <div class="gp-page-header__text">
      <h1 class="gp-page-header__title">Charger une évaluation</h1>
      <p class="gp-page-header__lead">Choisissez un emplacement pour reprendre l'évaluation qui y est enregistrée.</p>
    </div>
    <a class="gp-btn gp-btn--ghost" routerLink="/sauvegarde">
      <i class="bi bi-floppy" aria-hidden="true"></i>
      Gérer les sauvegardes
    </a>
  </header>

  <ul class="slots">
    @for (slot of slots; track slot.index) {
      <li>
        @if (slot.data === null) {
          <div class="load-card load-card--empty">
            <span class="load-card__number">Emplacement {{ slot.index }}</span>
            <span class="load-card__title">Vide</span>
          </div>
        } @else {
          <button type="button" class="load-card" (click)="loadSlot(slot.index)">
            <span class="load-card__number">
              Emplacement {{ slot.index }}
              @if (saveService.activeSlotIndex === slot.index) {
                <span class="gp-badge gp-badge--primary ms-1" [title]="tooltipCurrentEval">En cours</span>
              }
            </span>
            <span class="load-card__title gp-truncate">{{ slot.data.nomEval || 'Sans nom' }}</span>
            <span class="load-card__meta">Modifiée le {{ formatDate(slot.data.createdAt) }} · {{ slot.data.listScreens.length || 0 }} écran(s)</span>
            <span class="load-card__cta"><i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> Charger</span>
          </button>
        }
      </li>
    }
  </ul>

  <nav class="gp-actions" aria-label="Retour">
    <button type="button" class="gp-btn gp-btn--ghost" (click)="goBack()">
      <i class="bi bi-arrow-left" aria-hidden="true"></i>
      Retour à l'accueil
    </button>
  </nav>
</div>
