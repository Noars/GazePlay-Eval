<div class="gp-page">
  <header class="gp-page-header">
    <div class="gp-page-header__text">
      <h1 class="gp-page-header__title">{{ 'load.title' | t }}</h1>
      <p class="gp-page-header__lead">{{ 'load.lead' | t }}</p>
    </div>
    <a class="gp-btn gp-btn--ghost" routerLink="/sauvegarde">
      <i class="bi bi-floppy" aria-hidden="true"></i>
      {{ 'load.manage' | t }}
    </a>
  </header>

  <ul class="slots">
    @for (slot of slots; track slot.index) {
      <li>
        @if (slot.data === null) {
          <div class="load-card load-card--empty">
            <span class="load-card__number">{{ 'saves.slot' | t: {n: slot.index} }}</span>
            <span class="load-card__title">{{ 'load.empty' | t }}</span>
          </div>
        } @else {
          <button type="button" class="load-card" (click)="loadSlot(slot.index)">
            <span class="load-card__number">
              {{ 'saves.slot' | t: {n: slot.index} }}
              @if (saveService.activeSlotIndex === slot.index) {
                <span class="gp-badge gp-badge--primary ms-1" [title]="'saves.inProgress.tooltip' | t">{{ 'saves.inProgress' | t }}</span>
              }
            </span>
            <span class="load-card__title gp-truncate">{{ slot.data.nomEval || ('saves.unnamed' | t) }}</span>
            <span class="load-card__meta">{{ 'saves.slotMeta' | t: {date: formatDate(slot.data.createdAt), count: slot.data.listScreens.length || 0} }}</span>
            <span class="load-card__cta"><i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> {{ 'load.load' | t }}</span>
          </button>
        }
      </li>
    }
  </ul>

  <nav class="gp-actions" [attr.aria-label]="'saves.back' | t">
    <button type="button" class="gp-btn" (click)="goBack()">
      <i class="bi bi-arrow-left" aria-hidden="true"></i>
      {{ 'common.backHome' | t }}
    </button>
  </nav>
</div>
