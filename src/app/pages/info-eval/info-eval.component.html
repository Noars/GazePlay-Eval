<div class="gp-page gp-page--narrow">
  <header class="gp-page-header">
    <div class="gp-page-header__text">
      <span class="gp-page-header__eyebrow">{{ 'steps.eyebrow' | t: {current: 1} }}</span>
      <h1 class="gp-page-header__title">{{ 'infoEval.title' | t }}</h1>
      <p class="gp-page-header__lead">{{ 'infoEval.lead' | t }}</p>
    </div>
  </header>

  <form class="gp-card" (ngSubmit)="goToInfoParticipant()" novalidate>
    <div class="gp-card__body gp-stack">
      <div class="gp-field">
        <label for="evalName" class="gp-field__label">
          {{ 'infoEval.name.label' | t }}
          <app-help-tip [topic]="'infoEval.name.topic' | t" [text]="'infoEval.name.tooltip' | t"></app-help-tip>
        </label>
        <p class="gp-field__hint" id="evalNameHint">{{ 'infoEval.name.hint' | t }}</p>
        <input #nameInput
               type="text"
               class="form-control"
               id="evalName"
               name="evalName"
               autocomplete="off"
               [placeholder]="'infoEval.name.placeholder' | t"
               [attr.aria-invalid]="nameError ? 'true' : null"
               [attr.aria-describedby]="nameError ? 'evalNameHint evalNameError' : 'evalNameHint'"
               [ngModel]="evaluationName"
               (ngModelChange)="onNameChange($event)">
        @if (nameError) {
          <p class="gp-field__error" id="evalNameError">
            <i class="bi bi-exclamation-circle" aria-hidden="true"></i>{{ nameError }}
          </p>
        }
      </div>

      <fieldset class="gp-field">
        <legend class="gp-field__label">
          {{ 'infoEval.format.label' | t }}
          <app-help-tip [topic]="'infoEval.format.topic' | t" [text]="'infoEval.format.tooltip' | t"></app-help-tip>
        </legend>
        <p class="gp-field__hint">{{ 'infoEval.format.hint' | t }}</p>
        <div class="gp-choice-grid">
          @for (format of formats; track format.value) {
            <label class="gp-choice">
              <input class="gp-choice__input"
                     type="radio"
                     name="resultType"
                     [value]="format.value"
                     [checked]="resultType === format.value"
                     (change)="onFormatChange(format.value)">
              <span class="gp-choice__body">
                <span class="gp-choice__title">{{ format.label | t }}</span>
                <span class="gp-choice__desc">{{ format.description | t }}</span>
              </span>
            </label>
          }
        </div>
      </fieldset>
    </div>

    <div class="gp-card__footer">
      <div class="gp-actions mt-0 pt-0 border-0">
        <div class="gp-actions__end">
          <button type="submit" class="gp-btn gp-btn--primary">
            {{ 'infoEval.next' | t }}
            <i class="bi bi-arrow-right" aria-hidden="true"></i>
          </button>
        </div>
      </div>
    </div>
  </form>
</div>
