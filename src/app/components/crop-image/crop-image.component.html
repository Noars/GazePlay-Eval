<div class="gp-dialog">
  <div class="gp-dialog__header">
    <span class="gp-dialog__icon" aria-hidden="true"><i class="bi bi-crop"></i></span>
    <div>
      <h2 class="gp-dialog__title" id="crop-title">{{ 'crop.title' | t }}</h2>
      <p class="gp-dialog__subtitle">{{ 'crop.subtitle' | t }}</p>
    </div>
  </div>

  <div class="gp-dialog__body">
    <div class="cropper-stage">
      @if (imageToCrop) {
        <image-cropper
          #cropper
          [imageBase64]="imageToCrop"
          [cropper]="cropperPosition"
          [maintainAspectRatio]="false"
          [aspectRatio]="1"
          [imageQuality]="1"
          format="png"
          (cropperChange)="onCropperChange($event)"
          (imageCropped)="imageCropped($event)">
        </image-cropper>
      } @else {
        <p class="gp-muted" role="status"><span class="gp-spinner" aria-hidden="true"></span> {{ 'crop.loading' | t }}</p>
      }
    </div>

    <div class="crop-sizes">
      <div class="gp-field">
        <label class="gp-field__label" for="crop-width">{{ 'crop.width' | t }}</label>
        <span class="gp-input-unit">
          <input id="crop-width" type="number" class="form-control" min="1"
                 [max]="imageMaxWidth - cropWidthX1"
                 aria-describedby="crop-width-unit"
                 [(ngModel)]="cropWidthSize" (ngModelChange)="changeWidthCropper($event)">
          <span class="gp-input-unit__unit" id="crop-width-unit">px</span>
        </span>
      </div>
      <div class="gp-field">
        <label class="gp-field__label" for="crop-height">{{ 'crop.height' | t }}</label>
        <span class="gp-input-unit">
          <input id="crop-height" type="number" class="form-control" min="1"
                 [max]="imageMaxHeight - cropHeightY1"
                 aria-describedby="crop-height-unit"
                 [(ngModel)]="cropHeightSize" (ngModelChange)="changeHeightCropper($event)">
          <span class="gp-input-unit__unit" id="crop-height-unit">px</span>
        </span>
      </div>
    </div>
  </div>

  <div class="gp-dialog__footer">
    <button type="button" class="gp-btn gp-btn--ghost" (click)="cancelCrop()">{{ 'common.cancel' | t }}</button>
    <button type="button" class="gp-btn gp-btn--primary" (click)="validateCrop()">
      <i class="bi bi-check-lg" aria-hidden="true"></i>
      {{ 'crop.title' | t }}
    </button>
  </div>
</div>
