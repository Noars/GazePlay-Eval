<div class="gp-page gp-page--narrow">
  <header class="gp-page-header">
    <div class="gp-page-header__text">
      <span class="gp-page-header__eyebrow">Étape 3 sur 5 · Mode automatique</span>
      <h1 class="gp-page-header__title">Création automatique</h1>
    </div>
  </header>

  <div class="gp-callout gp-callout--warning">
    <i class="bi bi-cone-striped" aria-hidden="true"></i>
    <div class="gp-callout__body">
      <strong class="gp-callout__title">Fonctionnalité en cours de développement</strong>
      <p>
        La génération automatique des écrans n'est pas encore disponible. Vous pouvez continuer
        vers la création des écrans pour les ajouter vous-même, ou revenir au choix du mode.
      </p>
    </div>
  </div>

  <nav class="gp-actions" aria-label="Navigation entre les étapes">
    <button type="button" class="gp-btn gp-btn--ghost" (click)="backToEvalChoice()">
      <i class="bi bi-arrow-left" aria-hidden="true"></i>
      Changer de mode
    </button>
    <div class="gp-actions__end">
      <button type="button" class="gp-btn gp-btn--primary" (click)="startCreateEvalAuto()">
        Continuer vers la création des écrans
        <i class="bi bi-arrow-right" aria-hidden="true"></i>
      </button>
    </div>
  </nav>
</div>
