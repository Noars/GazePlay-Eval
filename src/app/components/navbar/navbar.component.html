<header class="gp-header">
  <button type="button"
          class="gp-btn gp-btn--ghost gp-btn--icon gp-header__menu-button"
          aria-label="Ouvrir le menu de navigation"
          aria-haspopup="dialog"
          (click)="menuRequested.emit()">
    <i class="bi bi-list" aria-hidden="true"></i>
  </button>

  <a class="gp-header__brand" routerLink="/home">
    <span class="gp-header__logo" aria-hidden="true"><i class="bi bi-eye"></i></span>
    <span class="gp-header__brand-text">GazePlay Eval</span>
    <span class="visually-hidden"> — accueil</span>
  </a>

  <div class="gp-header__actions">
    @if (showGuideButton()) {
      <app-icon-guide-popup></app-icon-guide-popup>
    }

    <button type="button"
            class="gp-btn gp-btn--ghost gp-btn--icon"
            [attr.aria-pressed]="isDark()"
            aria-label="Thème sombre"
            [title]="isDark() ? 'Passer au thème clair' : 'Passer au thème sombre'"
            (click)="changeTheme()">
      <i class="bi" [class.bi-sun]="getTheme() === 'sun'" [class.bi-moon-stars]="getTheme() === 'moon'" aria-hidden="true"></i>
    </button>

    <a class="gp-btn gp-btn--ghost gp-btn--icon" routerLink="/option" aria-label="Options et accessibilité" title="Options et accessibilité">
      <i class="bi bi-sliders" aria-hidden="true"></i>
    </a>
  </div>
</header>
