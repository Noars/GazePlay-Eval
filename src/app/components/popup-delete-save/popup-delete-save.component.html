<div class="gp-dialog">
  <div class="gp-dialog__header">
    <span class="gp-dialog__icon gp-dialog__icon--danger" aria-hidden="true"><i class="bi bi-trash3"></i></span>
    <div>
      <h2 class="gp-dialog__title" id="delete-title">{{ 'deleteSave.title' | t: {name: data.slotName} }}</h2>
      <p class="gp-dialog__subtitle">{{ 'deleteSave.subtitle' | t }}</p>
    </div>
  </div>

  <div class="gp-dialog__body" id="delete-message">
    <p class="mb-0">{{ 'deleteSave.body' | t }}</p>
    <button type="button" class="gp-btn gp-btn--secondary gp-btn--block" (click)="download()">
      <i class="bi bi-download" aria-hidden="true"></i>
      {{ 'deleteSave.downloadFirst' | t }}
    </button>
  </div>

  <div class="gp-dialog__footer">
    <button type="button" class="gp-btn gp-btn--ghost js-cancel" (click)="cancel()">{{ 'common.cancel' | t }}</button>
    <button type="button" class="gp-btn gp-btn--danger" (click)="delete()">
      <i class="bi bi-trash3" aria-hidden="true"></i>
      {{ 'deleteSave.confirm' | t }}
    </button>
  </div>
</div>
