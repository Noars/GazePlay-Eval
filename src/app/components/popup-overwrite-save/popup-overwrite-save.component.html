<div class="gp-dialog">
  <div class="gp-dialog__header">
    <span class="gp-dialog__icon gp-dialog__icon--warning" aria-hidden="true"><i class="bi bi-exclamation-triangle"></i></span>
    <div>
      <h2 class="gp-dialog__title" id="overwrite-title">{{ 'overwrite.title' | t }}</h2>
      <p class="gp-dialog__subtitle">{{ data.slotLabel }}</p>
    </div>
  </div>

  <div class="gp-dialog__body" id="overwrite-message">
    <p class="mb-0">
      {{ 'overwrite.body' | t: {name: data.save.nomEval || ('saves.unnamed' | t), date: (data.save.createdAt | date:('saves.dateTimeFormat' | t)) ?? ''} }}
    </p>
    <div class="gp-callout gp-callout--neutral">
      <i class="bi bi-lightbulb" aria-hidden="true"></i>
      <div class="gp-callout__body">
        <p>{{ 'overwrite.tip.before' | t }}<code>.gpSave</code>{{ 'overwrite.tip.after' | t }}</p>
      </div>
    </div>
  </div>

  <div class="gp-dialog__footer">
    <button type="button" class="gp-btn gp-btn--ghost js-cancel" (click)="cancel()">{{ 'common.cancel' | t }}</button>
    <button type="button" class="gp-btn gp-btn--danger-outline" (click)="overwrite()">{{ 'overwrite.withoutDownload' | t }}</button>
    <button type="button" class="gp-btn gp-btn--primary" (click)="download()">
      <i class="bi bi-download" aria-hidden="true"></i>
      {{ 'overwrite.downloadThenReplace' | t }}
    </button>
  </div>
</div>
