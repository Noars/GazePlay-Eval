<!--
  Index des paramètres globaux de stimuli (différents de ceux d'un écran, voir UpdateScreensService) :
  [0] lignes · [1] colonnes · [2] temps maximum ? · [3] durée maximum · [4] durée de fixation ·
  [5] nombre de stimuli à valider · [6] cacher après sélection ? · [7] position aléatoire ?
-->
<h3 class="gp-subheading">Taille de la grille</h3>
<app-number-setting label="Nombre de lignes" [min]="1" step="1" hint="Minimum 1."
                    [(ngModel)]="globalStimuliScreenInfos[0]"></app-number-setting>
<app-number-setting label="Nombre de colonnes" [min]="1" step="1" hint="Minimum 1."
                    [(ngModel)]="globalStimuliScreenInfos[1]"></app-number-setting>

<h3 class="gp-subheading">Temps maximum par écran</h3>
<app-choice-setting label="Limiter le temps passé sur chaque écran ?"
                    [(ngModel)]="globalStimuliScreenInfos[2]"></app-choice-setting>
@if (globalStimuliScreenInfos[2]) {
  <app-number-setting label="Temps maximum" unit="secondes" [min]="0.1" step="0.1"
                      [(ngModel)]="globalStimuliScreenInfos[3]"></app-number-setting>
}

<h3 class="gp-subheading">Validation</h3>
<app-number-setting label="Durée de fixation pour valider un stimulus" unit="secondes" [min]="0.1" step="0.1"
                    [(ngModel)]="globalStimuliScreenInfos[4]"></app-number-setting>
<app-number-setting label="Nombre de stimuli à valider pour passer à l'écran suivant"
                    [hint]="'Maximum : ' + maxStimuli + ' (lignes × colonnes).'"
                    [min]="1" [max]="maxStimuli" step="1"
                    [(ngModel)]="globalStimuliScreenInfos[5]"></app-number-setting>

<h3 class="gp-subheading">Comportement des stimuli</h3>
<app-choice-setting label="Placer les stimuli aléatoirement ?"
                    [(ngModel)]="globalStimuliScreenInfos[7]"></app-choice-setting>
<app-choice-setting label="Cacher un stimulus une fois sélectionné ?"
                    [(ngModel)]="globalStimuliScreenInfos[6]"></app-choice-setting>
