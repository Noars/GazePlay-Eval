<ng-template #navContent>
  <nav class="gp-nav" aria-label="Navigation principale">
    <p class="gp-nav__section" aria-hidden="true">Navigation</p>
    <ul class="gp-nav__list">
      @for (item of navigationItems; track item.route) {
        <li>
          <a class="gp-nav__link"
             [routerLink]="item.route"
             routerLinkActive="is-active"
             ariaCurrentWhenActive="page"
             [routerLinkActiveOptions]="{exact: !!item.exact}">
            <i class="bi" [class]="item.icon" aria-hidden="true"></i>
            <span>{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>

    <p class="gp-nav__section" aria-hidden="true">Projet</p>
    <ul class="gp-nav__list">
      @for (item of projectItems; track item.route) {
        <li>
          <a class="gp-nav__link"
             [routerLink]="item.route"
             routerLinkActive="is-active"
             ariaCurrentWhenActive="page">
            <i class="bi" [class]="item.icon" aria-hidden="true"></i>
            <span>{{ item.label }}</span>
          </a>
        </li>
      }
      <li>
        <button type="button" class="gp-nav__link" [disabled]="importing()" (click)="openImportPopup()">
          @if (importing()) {
            <span class="gp-spinner" aria-hidden="true"></span>
            <span>Import en cours…</span>
          } @else {
            <i class="bi bi-box-arrow-in-down" aria-hidden="true"></i>
            <span>Importer un fichier</span>
          }
        </button>
      </li>
    </ul>
  </nav>
</ng-template>

@if (mode === 'sidebar') {
  <ng-container [ngTemplateOutlet]="navContent"></ng-container>
} @else {
  <dialog #drawer class="gp-drawer" aria-labelledby="menu-drawer-title" (click)="onDrawerClick($event)">
    <div class="gp-drawer__header">
      <h2 class="gp-drawer__title" id="menu-drawer-title">Menu</h2>
      <button type="button" class="gp-btn gp-btn--ghost gp-btn--icon" aria-label="Fermer le menu" (click)="close()">
        <i class="bi bi-x-lg" aria-hidden="true"></i>
      </button>
    </div>
    <div class="gp-drawer__body">
      <ng-container [ngTemplateOutlet]="navContent"></ng-container>
    </div>
  </dialog>
}
