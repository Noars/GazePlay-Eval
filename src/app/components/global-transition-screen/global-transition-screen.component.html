<!--
  Index du tableau (identiques pour les paramètres globaux et pour un écran de transition) :
  [0] temps avant écran suivant ? · [1] durée · [2] croix de fixation ? · [3] temps de fixation ? · [4] durée de fixation
-->
<h3 class="gp-subheading">{{ 'screen.next.heading' | t }}</h3>
<app-choice-setting [label]="'screen.next.auto' | t"
                    [(ngModel)]="globalTransitionScreenInfos[0]"></app-choice-setting>
@if (globalTransitionScreenInfos[0]) {
  <app-number-setting [label]="'screen.next.delay' | t" [unit]="'screen.unit.seconds' | t" [min]="0.1" step="0.1"
                      [(ngModel)]="globalTransitionScreenInfos[1]"></app-number-setting>
}

<h3 class="gp-subheading">{{ 'screen.fixation.heading' | t }}</h3>
<app-choice-setting [label]="'screen.fixation.show' | t"
                    [(ngModel)]="globalTransitionScreenInfos[2]"></app-choice-setting>
@if (globalTransitionScreenInfos[2]) {
  <app-choice-setting [label]="'screen.fixation.require' | t"
                      [(ngModel)]="globalTransitionScreenInfos[3]"></app-choice-setting>
  @if (globalTransitionScreenInfos[3]) {
    <app-number-setting [label]="'screen.fixation.duration' | t" [unit]="'screen.unit.seconds' | t" [min]="0.1" step="0.1"
                        [(ngModel)]="globalTransitionScreenInfos[4]"></app-number-setting>
  }
}
