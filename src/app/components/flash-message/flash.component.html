<!--
  Deux zones annoncées en permanence dans le DOM (condition pour que les lecteurs d'écran
  annoncent les messages ajoutés) : polie pour les informations, assertive pour les erreurs.
-->
<div class="flash-container">
  <div class="flash-region" role="status" aria-live="polite">
    @for (flash of flashService.flashs(); track flash.id) {
      @if (flash.type === 'info' || flash.type === 'success') {
        <ng-container [ngTemplateOutlet]="flashTemplate" [ngTemplateOutletContext]="{$implicit: flash}"></ng-container>
      }
    }
  </div>
  <div class="flash-region" role="alert" aria-live="assertive">
    @for (flash of flashService.flashs(); track flash.id) {
      @if (flash.type === 'warning' || flash.type === 'error') {
        <ng-container [ngTemplateOutlet]="flashTemplate" [ngTemplateOutletContext]="{$implicit: flash}"></ng-container>
      }
    }
  </div>
</div>

<ng-template #flashTemplate let-flash>
  <div class="flash flash--{{ mapType(flash.type) }}" [class.fade-out]="flash.fadingOut">
    <i class="bi {{ mapIcon(flash.type) }} flash__icon" aria-hidden="true"></i>
    <p class="flash__message">
      <span class="flash__type">{{ mapLabel(flash.type) | t }}</span>{{ flash.message }}
    </p>
    <button type="button" class="flash__close" [attr.aria-label]="'flash.close' | t" (click)="flashService.remove(flash.id)">
      <i class="bi bi-x-lg" aria-hidden="true"></i>
    </button>
  </div>
</ng-template>
