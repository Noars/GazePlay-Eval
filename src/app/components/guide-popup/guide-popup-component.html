<dialog #dialog
        class="gp-drawer gp-drawer--end guide-popup-panel"
        [class.open]="isOpen"
        [style.width.px]="panelWidth"
        aria-labelledby="guide-popup-title"
        (close)="onDialogClosed()"
        (click)="onDialogClick($event)">
  <div class="resize-handle"
       role="separator"
       tabindex="0"
       aria-orientation="vertical"
       aria-label="Largeur du panneau d'aide (flèches gauche et droite)"
       [attr.aria-valuenow]="panelWidth"
       aria-valuemin="280"
       [attr.aria-valuemax]="maxWidth"
       (pointerdown)="startResize($event)"
       (keydown)="onResizeKey($event)"></div>

  <div class="gp-drawer__header guide-popup-header">
    <h2 class="gp-drawer__title guide-popup-title" id="guide-popup-title">
      <i class="bi bi-question-circle me-2" aria-hidden="true"></i>{{ currentGuide.title }}
    </h2>
    <button type="button"
            class="gp-btn gp-btn--ghost gp-btn--icon"
            aria-label="Fermer l'aide"
            title="Fermer l'aide"
            (click)="close()">
      <i class="bi bi-x-lg" aria-hidden="true"></i>
    </button>
  </div>

  <div class="guide-popup-body">
    @if (isOpen) {
      @if (currentGuideComponent) {
        <ng-container *ngComponentOutlet="currentGuideComponent; inputs: currentGuideInputs"></ng-container>
      } @else {
        @if (currentGuide.intro) {
          <p class="guide-content-sub">{{ currentGuide.intro }}</p>
        }

        @for (section of currentGuide.sections; track section.title) {
          <section class="guide-section-card">
            <h3 class="guide-section-title">{{ section.title }}</h3>
            <p class="guide-section-body">{{ section.body }}</p>
          </section>
        } @empty {
          <div class="gp-empty">
            <i class="bi bi-book" aria-hidden="true"></i>
            <a class="gp-btn gp-btn--secondary" href="#/guide" (click)="close()">Ouvrir le guide complet</a>
          </div>
        }
      }
    }
  </div>
</dialog>
