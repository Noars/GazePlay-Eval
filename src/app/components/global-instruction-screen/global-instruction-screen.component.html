<!--
  Index des paramètres globaux d'instruction (différents de ceux d'un écran, voir UpdateScreensService) :
  [0] temps avant écran suivant ? · [1] durée · [2] ajouter un média ? · [3] type de média ·
  [4] bouton de lancement ? · [5] durée de fixation du bouton
-->
<h3 class="gp-subheading">{{ 'screen.next.heading' | t }}</h3>
<app-choice-setting [label]="'screen.next.auto' | t"
                    [(ngModel)]="globalInstructionScreenInfos[0]"></app-choice-setting>
@if (globalInstructionScreenInfos[0]) {
  <app-number-setting [label]="'screen.next.delay' | t" [unit]="'screen.unit.seconds' | t" [min]="0.1" step="0.1"
                      [(ngModel)]="globalInstructionScreenInfos[1]"></app-number-setting>
}

<h3 class="gp-subheading">{{ 'screen.media.heading' | t }}</h3>
<app-choice-setting [label]="'screen.media.add' | t"
                    [(ngModel)]="globalInstructionScreenInfos[2]"></app-choice-setting>
@if (globalInstructionScreenInfos[2]) {
  <app-choice-setting [label]="'screen.media.defaultType' | t"
                      [options]="mediaTypeOptions"
                      [(ngModel)]="globalInstructionScreenInfos[3]"></app-choice-setting>
}

<h3 class="gp-subheading">{{ 'screen.startButton.heading' | t }}</h3>
<app-choice-setting [label]="'screen.startButton.add' | t"
                    [hint]="'screen.startButton.hint' | t"
                    [(ngModel)]="globalInstructionScreenInfos[4]"></app-choice-setting>
@if (globalInstructionScreenInfos[4]) {
  <app-number-setting [label]="'screen.startButton.duration' | t" [unit]="'screen.unit.seconds' | t" [min]="0.1" step="0.1"
                      [(ngModel)]="globalInstructionScreenInfos[5]"></app-number-setting>
}
