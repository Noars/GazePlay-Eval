<div class="gp-page gp-page--narrow">
  <header class="gp-page-header">
    <div class="gp-page-header__text">
      <span class="gp-page-header__eyebrow">{{ 'setup.manual.eyebrow' | t }}</span>
      <h1 class="gp-page-header__title">{{ 'setup.manual.title' | t }}</h1>
      <p class="gp-page-header__lead">{{ 'setup.manual.lead' | t }}</p>
    </div>
  </header>

  @for (section of sections; track section.id) {
    <section class="gp-disclosure">
      <h2 class="gp-disclosure__heading">
        <button type="button"
                class="gp-disclosure__trigger"
                [id]="'global-' + section.id + '-trigger'"
                [attr.aria-expanded]="openAccordion === section.id"
                [attr.aria-controls]="'global-' + section.id + '-panel'"
                (click)="toggleAccordion(section.id)">
          <span class="gp-disclosure__icon" aria-hidden="true"><i class="bi" [class]="section.icon"></i></span>
          <span>
            {{ section.title | t }}
            <span class="gp-disclosure__summary">{{ section.summary | t }}</span>
          </span>
          <i class="bi bi-chevron-down gp-disclosure__chevron" aria-hidden="true"></i>
        </button>
      </h2>
      <div class="gp-disclosure__panel"
           role="region"
           [id]="'global-' + section.id + '-panel'"
           [attr.aria-labelledby]="'global-' + section.id + '-trigger'"
           [hidden]="openAccordion !== section.id">
        @switch (section.id) {
          @case ('transition') {
            <app-global-transition-screen [globalTransitionScreenInfos]="globalTransitionScreenInfos"></app-global-transition-screen>
          }
          @case ('instruction') {
            <app-global-instruction-screen [globalInstructionScreenInfos]="globalInstructionScreenInfos"></app-global-instruction-screen>
          }
          @case ('stimuli') {
            <app-global-stimuli-screen [globalStimuliScreenInfos]="globalStimuliScreenInfos"></app-global-stimuli-screen>
          }
        }
      </div>
    </section>
  }

  <nav class="gp-actions" [attr.aria-label]="'steps.nav' | t">
    <button type="button" class="gp-btn gp-btn--ghost" (click)="backToEvalChoice()">
      <i class="bi bi-arrow-left" aria-hidden="true"></i>
      {{ 'setup.changeMode' | t }}
    </button>
    <div class="gp-actions__end">
      <button type="button" class="gp-btn gp-btn--primary" (click)="startCreateEvalManual()">
        {{ 'setup.manual.next' | t }}
        <i class="bi bi-arrow-right" aria-hidden="true"></i>
      </button>
    </div>
  </nav>
</div>
