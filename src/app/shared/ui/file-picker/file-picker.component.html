<span class="gp-file-picker">
  <input #input
         class="gp-file-picker__input"
         type="file"
         [id]="inputId"
         [accept]="accept"
         [disabled]="disabled"
         [attr.aria-label]="accessibleName"
         (change)="onChange()">
  <label class="gp-btn gp-file-picker__button"
         [class.gp-btn--secondary]="variant === 'secondary'"
         [class.gp-btn--primary]="variant === 'primary'"
         [class.gp-btn--ghost]="variant === 'ghost'"
         [attr.aria-disabled]="disabled ? 'true' : null"
         [for]="inputId"
         aria-hidden="true">
    <i class="bi" [class]="icon" aria-hidden="true"></i>
    <span>{{ fileName || label }}</span>
  </label>
</span>
